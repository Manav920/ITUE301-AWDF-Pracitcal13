# Configure trigger for both push and pull_request targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality & Lint Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Linter & Static Analysis
        working-directory: ./backend
        run: npm run lint

  build-and-test:
    name: Build & Automated Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies (npm install)
        working-directory: ./backend
        run: npm ci

      - name: Execute Automated Test Suite (Jest & Supertest)
        working-directory: ./backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: supersecret_ci_test_key_24cs048
          GEMINI_API_KEY: your_gemini_api_key_here
          PORT: 5000

      - name: Pipeline Status Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Practical 13 CI Pipeline Completed"
          echo "Student: Manav Lathiya (24CS048)"
          echo "Test Job Status: ${{ job.status }}"
          echo "=========================================="
